<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberwake — a third-person action RPG in your browser</title>
<meta name="description" content="Emberwake is a browser-native third-person action RPG: stamina-driven souls-like combat, a party that fights beside you, and spirits you can bind to your covenant.">
<meta name="theme-color" content="#0b0a10">
<meta property="og:title" content="Emberwake">
<meta property="og:description" content="A third-person action RPG that runs in a browser tab.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/ui.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="viewport" aria-label="Game viewport"></canvas>

<!-- Everything non-3D lives here. Rendered as DOM so it stays crisp and accessible. -->
<div id="ui" class="ui-root" aria-live="polite"></div>

<div id="boot" class="boot">
  <div class="boot__inner">
    <div class="boot__mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4c6 12 18 16 18 30a18 18 0 0 1-36 0C14 20 26 16 32 4Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M32 26c3 6 8 8 8 14a8 8 0 0 1-16 0c0-6 5-8 8-14Z" fill="currentColor" opacity=".85"/></svg>
    </div>
    <h1 class="boot__title">EMBERWAKE</h1>
    <p class="boot__sub">Kindling the world</p>
    <div class="boot__bar"><i id="boot-fill"></i></div>
    <p class="boot__status" id="boot-status">Preparing…</p>
  </div>
</div>

<noscript>
  <div class="boot"><div class="boot__inner">
    <h1 class="boot__title">EMBERWAKE</h1>
    <p class="boot__sub">This game needs JavaScript and WebGL 2 to run.</p>
  </div></div>
</noscript>

<script type="module">
  import { boot } from './src/main.js';
  boot().catch((err) => {
    console.error(err);
    const status = document.getElementById('boot-status');
    const boot_ = document.getElementById('boot');
    if (boot_) boot_.classList.remove('boot--done');
    if (status) {
      status.textContent = String(err && err.message ? err.message : err);
      status.classList.add('boot__status--error');
    }
  });
</script>
</body>
</html>
