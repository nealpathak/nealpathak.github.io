<script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js"}}</script>

pre{line-height:1.7}</style>
</head><body><pre id="out">running…</pre>
<script type="module">
// Headless exercise of the real simulation modules — no renderer, no input
// device. Mirrors main.js's step order exactly; if the two drift, this lies.

import * as THREE from 'three';
import { buildWorld } from './src/world.js';
import { LEVELS, campaignSize } from './src/levels.js';
import { Player, bearing } from './src/player.js';
import * as config from './src/settings.js';
import { Weapon } from './src/weapon.js';
import { Horde, TYPES, MAX_ALIVE } from './src/zombies.js';
import { Campaign } from './src/campaign.js';
import { DIFFICULTIES, UPGRADES, baseStats, statsFrom, draft } from './src/upgrades.js';

const log = [];
let fails = 0;
const ok = (name, cond, extra = '') => {
  log.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '   ' + extra : ''));
  if (!cond) fails++;
};
const note = (s) => log.push('     · ' + s);
const head = (s) => log.push('', '── ' + s + ' ' + '─'.repeat(Math.max(0, 58 - s.length)));

const STEP = 1 / 60;
const keys = new Set();
const input = { down: (c) => keys.has(c), takeLook: () => ({ yaw: 0, pitch: 0 }), takeFire: () => false, fireHeld: false };

const camera = new THREE.PerspectiveCamera(78, 16 / 9, 0.05, 220);
let kills = 0, headshots = 0, playerHits = 0;

const campaign = new Campaign({
  onWaveStart: (n, t, w) => weapon.grantWaveAmmo(w.n, campaign.difficulty.ammo),
  onWaveCleared: () => {},
  onLevelCleared: () => { levelClearedFired++; },
  onCampaignWon: () => { wonFired++; },
});
let levelClearedFired = 0, wonFired = 0;

const player = new Player(camera, campaign.stats);
const horde = new Horde({
  onPlayerHit: (d) => { if (player.dead) return; playerHits++; player.damage(d); },
  onKill: (z, h) => { kills++; campaign.kills++; if (h) headshots++; },
});
const weapon = new Weapon({
  onShot: () => campaign.shotsFired++, onDryFire(){}, onReload(){},
  onHit: () => campaign.shotsHit++, onImpact(){},
}, campaign.stats);

let world = null;
function loadLevel(i) {
  if (world) world.dispose();
  world = buildWorld(LEVELS[i]);
  horde.attachTo(world.scene);
  weapon.attachTo(world.scene);
  player.setSpawn(LEVELS[i].spawn[0], LEVELS[i].spawn[1]);
  horde.clear();
  player.reset();
  weapon.reset();
  weapon.loadForLevel(campaign.difficulty.ammo);
}

/** Same order as main.js's simulate(). */
function sim(n, wantFire = false) {
  for (let i = 0; i < n; i++) {
    world.update(STEP);
    player.step(STEP, input, world.colliders);
    horde.step(STEP, player.pos, world.colliders);
    if (!player.dead) campaign.step(STEP, horde, world, player.pos, world.colliders);

    const targets = [];
    if (wantFire && !player.dead) {
      player.render(1); camera.updateMatrixWorld(); horde.syncForRaycast();
      for (const p of horde.targets()) targets.push(p);
      for (const s of world.solids) targets.push(s);
    }
    player.render(0);
    weapon.step(STEP, {
      wantFire: wantFire && !player.dead, camera, targets, horde,
      speed: Math.hypot(player.vel.x, player.vel.z),
    });
  }
}

const EYE = 1.68;
function aimAt(x, y, z) {
  const dx = x - player.pos.x, dz = z - player.pos.z;
  player.yaw = Math.atan2(-dx, -dz);
  player.pitch = Math.atan2(y - (player.pos.y + EYE), Math.hypot(dx, dz));
}
function fireOnce() {
  weapon.cooldown = 0; weapon.reloading = 0;
  if (weapon.mag === 0) weapon.mag = weapon.magSize;
  player.render(1); camera.updateMatrixWorld(); horde.syncForRaycast();
  const targets = [...horde.targets(), ...world.solids];
  weapon.step(STEP, { wantFire: true, camera, targets, horde, speed: 0 });
}

campaign.begin('standard');
player.useStats(campaign.stats);
weapon.useStats(campaign.stats);
loadLevel(0);

// ===========================================================================
head('campaign shape');

ok('six levels', LEVELS.length === 6, `n=${LEVELS.length}`);
ok('every level has an id, spawn, waves and geometry', LEVELS.every((l) =>
  l.id && Array.isArray(l.spawn) && l.waves.length > 0 && typeof l.build === 'function'));
ok('level ids are unique', new Set(LEVELS.map((l) => l.id)).size === LEVELS.length);
ok('difficulty climbs monotonically across levels', LEVELS.every((l, i) =>
  i === 0 || (l.enemy.hp > LEVELS[i - 1].enemy.hp && l.enemy.speed >= LEVELS[i - 1].enemy.speed)));
ok('wave sizes climb within every level', LEVELS.every((l) =>
  l.waves.every((w, i) => i === 0 || w.n >= l.waves[i - 1].n)));
ok('no wave exceeds the pool', LEVELS.every((l) => l.waves.every((w) => w.alive <= MAX_ALIVE)));

const total = campaignSize();
const waveCount = LEVELS.reduce((s, l) => s + l.waves.length, 0);
// 2.2s per kill is the working assumption; breathers and briefings are exact.
const estimate = (total * 2.2 + waveCount * 6.5 + LEVELS.length * 12) / 60;
ok('campaign lands near an hour', estimate > 40 && estimate < 80, `${estimate.toFixed(0)} min estimated`);
note(`${total} zombies across ${waveCount} waves in ${LEVELS.length} levels`);

// ===========================================================================
head('enemy types');

ok('runners are faster and frailer than shamblers',
  TYPES.runner.speed > TYPES.shambler.speed && TYPES.runner.hp < TYPES.shambler.hp);
ok('brutes are tougher and slower', TYPES.brute.hp > 3 && TYPES.brute.speed < 1);
ok('every level uses more than one type', LEVELS.every((l) =>
  new Set(l.waves.flatMap((w) => Object.keys(w.mix))).size > 1));
ok('runners appear before brutes do', (() => {
  const first = (t) => LEVELS.flatMap((l) => l.waves).findIndex((w) => w.mix[t]);
  return first('runner') < first('brute');
})());

// A brute must outlast a shambler under identical fire.
const shots = (hp) => { let n = 0, h = hp; while (h > 0 && n < 200) { h -= baseStats().damage; n++; } return n; };
const l6 = LEVELS[5].enemy.hp;
ok('a level-6 brute takes real work', shots(l6 * TYPES.brute.hp) > shots(l6 * TYPES.shambler.hp) * 3,
  `${shots(l6 * TYPES.brute.hp)} vs ${shots(l6 * TYPES.shambler.hp)} body shots`);

// ===========================================================================
head('difficulty');

ok('three difficulties', DIFFICULTIES.length === 3);
ok('difficulty scales in the right direction', (() => {
  const [r, s, n] = DIFFICULTIES;
  return r.hp < s.hp && s.hp < n.hp && r.damage < n.damage && r.ammo > n.ammo;
})());

const rookieHp = LEVELS[0].enemy.hp * DIFFICULTIES[0].hp;
const nightHp = LEVELS[0].enemy.hp * DIFFICULTIES[2].hp;
note(`level 1 shambler: ${rookieHp.toFixed(0)} hp rookie, ${nightHp.toFixed(0)} hp nightmare`);

// ===========================================================================
head('upgrades');

ok('upgrade ids are unique', new Set(UPGRADES.map((u) => u.id)).size === UPGRADES.length);
ok('every upgrade changes something', UPGRADES.every((u) => {
  const before = baseStats(), after = baseStats();
  u.apply(after);
  return JSON.stringify(before) !== JSON.stringify(after);
}));
ok('a draft offers three distinct cards', (() => {
  const d = draft([], 3);
  return d.length === 3 && new Set(d.map((u) => u.id)).size === 3;
})());
ok('a draft avoids what you already hold', (() => {
  const taken = UPGRADES.slice(0, 4).map((u) => u.id);
  return draft(taken, 3).every((u) => !taken.includes(u.id));
})());
ok('drafting still offers three once the pool is exhausted',
  draft(UPGRADES.map((u) => u.id), 3).length === 3);
ok('stats rebuild identically from the same id list', (() => {
  const ids = ['hollow', 'mag', 'boots'];
  return JSON.stringify(statsFrom(ids)) === JSON.stringify(statsFrom(ids));
})());
ok('upgrades stack', statsFrom(['hollow', 'hollow']).damage > statsFrom(['hollow']).damage);

// A five-upgrade build must be meaningfully stronger than none.
const strong = statsFrom(['hollow', 'marksman', 'mag', 'trigger', 'steady']);
ok('a full build measurably out-damages the base kit',
  strong.damage / baseStats().damage > 1.25 && strong.fireInterval < baseStats().fireInterval);
note(`base dps ${(baseStats().damage / baseStats().fireInterval).toFixed(0)}`
  + ` → built dps ${(strong.damage / strong.fireInterval).toFixed(0)}`);

// ===========================================================================
head('every arena is playable');

for (let i = 0; i < LEVELS.length; i++) {
  loadLevel(i);
  const l = LEVELS[i];

  // The spawn point must not be inside the level's own geometry.
  const before = player.pos.clone();
  sim(30);
  const shoved = player.pos.distanceTo(before);
  ok(`${l.name}: spawn is clear`, shoved < 0.5, `moved ${shoved.toFixed(2)}m unbidden`);

  // Sprint at each wall for eight seconds; none of them may give.
  let escaped = null;
  for (const [dir, yaw] of [['N', 0], ['S', Math.PI], ['E', -Math.PI/2], ['W', Math.PI/2]]) {
    player.reset(); player.yaw = yaw;
    keys.add('KeyW'); keys.add('ShiftLeft'); sim(60 * 8); keys.clear();
    if (Math.abs(player.pos.x) > l.half || Math.abs(player.pos.z) > l.half) escaped = dir;
  }
  ok(`${l.name}: arena holds`, !escaped, escaped ? `escaped ${escaped}` : '');
  player.reset();
}

// ===========================================================================
head('waves and progression');

campaign.begin('standard');
player.useStats(campaign.stats); weapon.useStats(campaign.stats);
loadLevel(0);
campaign.startLevel();
sim(60 * 5);
ok('the first wave starts on its own', campaign.waveIndex === 0 && campaign.state === 'wave');
sim(60 * 20);
ok('zombies actually spawn', horde.aliveCount > 0, `alive=${horde.aliveCount}`);
ok('spawning respects the wave cap', horde.aliveCount <= campaign.wave.alive,
  `${horde.aliveCount} <= ${campaign.wave.alive}`);
ok('reserve ammo arrived with the wave', weapon.reserve > 120, `reserve=${weapon.reserve}`);

// Clear the level by fiat and confirm the campaign advances rather than looping.
const startLevelIndex = campaign.levelIndex;
campaign.toSpawn = 0; horde.clear();
campaign.waveIndex = campaign.waveCount - 1;
sim(2);
ok('finishing the last wave clears the level', levelClearedFired === 1 && campaign.state === 'cleared');
campaign.takeUpgrade('hollow');
ok('taking an upgrade rebuilds stats', campaign.stats.damage > baseStats().damage);
ok('advancing moves to the next level', campaign.advance() && campaign.levelIndex === startLevelIndex + 1);

// The last level ends the campaign instead of advancing off the end.
campaign.levelIndex = LEVELS.length - 1;
loadLevel(campaign.levelIndex);
campaign.startLevel();
campaign.waveIndex = campaign.waveCount - 1;
campaign.state = 'wave';
campaign.toSpawn = 0; horde.clear();
sim(2);
ok('the final level wins the campaign', wonFired === 1 && campaign.state === 'won');
ok('a won campaign cannot advance further', campaign.advance() === false);

// ===========================================================================
head('gunplay');

campaign.begin('standard');
player.useStats(campaign.stats); weapon.useStats(campaign.stats);
loadLevel(0);

function scenario(x, z, hp, type = 'shambler', speed = 0.001) {
  player.reset(); weapon.reset(); weapon.loadForLevel(1); horde.clear();
  horde.spawnAt(new THREE.Vector3(x, 0, z), hp, speed, world.colliders, null, type, 1);
  return horde.pool.find((k) => k.active);
}

const z1 = scenario(0, 6, LEVELS[0].enemy.hp);
player.pos.set(0, 0, 14);
aimAt(z1.pos.x, 1.06, z1.pos.z);
let before = kills, n = 0;
while (kills === before && n < 12) { fireOnce(); n++; }
ok('body shots kill a level-1 shambler', kills > before, `${n} shots at ${LEVELS[0].enemy.hp} hp`);
ok('it is not a one-shot', n > 1, `${n} shots`);

// Head beats chest at identical health.
const hp = 80;
scenario(0, 6, hp); player.pos.set(0, 0, 14);
aimAt(0, 1.57, 6); before = kills; fireOnce();
const headKilled = kills > before;
scenario(0, 6, hp); player.pos.set(0, 0, 14);
aimAt(0, 1.06, 6); before = kills; fireOnce();
const bodyKilled = kills > before;
ok('headshots do more damage', headKilled && !bodyKilled,
  `${hp} hp: head ${headKilled ? 'kills' : 'does not'}, chest ${bodyKilled ? 'kills' : 'does not'}`);
ok('headshots are reported as such', headshots > 0);

// Marksman must make that gap bigger.
const withMarksman = statsFrom(['marksman']);
ok('Marksman raises the headshot multiplier',
  withMarksman.headshotMult > baseStats().headshotMult,
  `${baseStats().headshotMult} -> ${withMarksman.headshotMult}`);

// Bullets stop at the level.
const z2 = scenario(0, -6, 40); player.pos.set(0, 0, 6);
aimAt(0, 1.06, -6); before = kills;
for (let i = 0; i < 6; i++) fireOnce();
ok('walls stop bullets', kills === before, 'six shots through the centre block killed nothing');

// Brutes really do soak.
const brute = scenario(0, 6, LEVELS[0].enemy.hp * TYPES.brute.hp, 'brute');
player.pos.set(0, 0, 14); aimAt(0, 1.06 * TYPES.brute.scale, 6);
before = kills; let bruteShots = 0;
while (kills === before && bruteShots < 40) { fireOnce(); bruteShots++; }
// Compare the margin, not the ratio: a shambler needing 1.3 shots rounds up to
// 2, which inflates the denominator and makes a ratio test brittle.
ok('a brute takes many more shots than a shambler', bruteShots >= n * 2,
  `${bruteShots} vs ${n} for a shambler on level 1`);

// ===========================================================================
head('ammo economy');

// Can each level be finished on what it grants, at ~2.5 shots per kill?
let tight = [];
for (const l of LEVELS) {
  const granted = 120 + l.waves.reduce((s, w) => s + Math.round(w.n * 3.2), 0);
  const needed = l.waves.reduce((s, w) => s + w.n, 0) * 2.5;
  if (granted < needed * 0.85) tight.push(`${l.name} ${granted}/${Math.round(needed)}`);
}
ok('every level grants enough ammunition to finish it', tight.length === 0, tight.join(', '));
note('grant is 3.2 rounds per zombie; a body kill averages ~2.5 at base damage');

weapon.reset(); weapon.loadForLevel(1);
const start = weapon.reserve;
weapon.grantWaveAmmo(30, 1);
ok('wave resupply adds ammunition', weapon.reserve > start, `${start} -> ${weapon.reserve}`);
for (let i = 0; i < 50; i++) weapon.grantWaveAmmo(40, 1);
ok('reserve is capped', weapon.reserve <= 400, `reserve=${weapon.reserve}`);

weapon.mag = 0; weapon.reserve = 30; weapon.startReload(); sim(60 * 3);
ok('reload refills from reserve', weapon.mag === weapon.magSize && weapon.reserve === 30 - weapon.magSize,
  `mag=${weapon.mag} reserve=${weapon.reserve}`);
weapon.mag = 5; weapon.reserve = 0; weapon.startReload(); sim(60 * 3);
ok('empty reserve cannot reload', weapon.mag === 5);

// ===========================================================================
head('player');

loadLevel(0); player.reset();
let mark = player.pos.clone();
keys.add('KeyW'); sim(60);
const walked = player.pos.distanceTo(mark);
player.reset(); keys.add('ShiftLeft'); mark = player.pos.clone(); sim(60);
const sprinted = player.pos.distanceTo(mark);
keys.clear();
ok('sprint beats walk', sprinted > walked + 1.5, `${sprinted.toFixed(2)} vs ${walked.toFixed(2)} m/s`);

// Combat Boots must be felt.
player.useStats(statsFrom(['boots']));
player.reset(); keys.add('KeyW'); mark = player.pos.clone(); sim(60); keys.clear();
const booted = player.pos.distanceTo(mark);
ok('Combat Boots speed the player up', booted > walked + 0.4, `${booted.toFixed(2)} vs ${walked.toFixed(2)} m/s`);
player.useStats(baseStats());

// Field Dressing must raise the ceiling, and top you up rather than shrink you.
player.reset();
const hpBefore = player.health;
player.useStats(statsFrom(['dressing']));
ok('Field Dressing raises max health and does not shrink current',
  player.maxHealth > hpBefore && player.health >= hpBefore,
  `${hpBefore} -> ${player.health}/${player.maxHealth}`);
player.useStats(baseStats());

player.reset(); horde.clear();
player.health = 50; player.sinceDamage = 99;
sim(60 * 2);
ok('health regenerates after the delay', player.health > 50, `50 -> ${player.health.toFixed(0)} hp`);

player.reset(); horde.clear();
horde.spawnAt(new THREE.Vector3(0, 0, 13), 500, 2.0, world.colliders, null, 'shambler', 1);
const hp0 = player.health;
sim(60 * 8);
ok('a zombie in reach damages the player', player.health < hp0, `${hp0} -> ${player.health.toFixed(0)} hp`);

const hitsAtDeath = playerHits;
while (!player.dead) player.damage(25);
sim(60 * 3);
ok('a dead player takes no further damage', playerHits === hitsAtDeath && player.health === 0);
ok('the horde keeps moving during the death cam', horde.pool.some((z) => z.active));

// ===========================================================================
head('settings');

const defs = config.defaults();
ok('defaults are in range', config.SCHEMA.every((f) => defs[f.id] >= f.min && defs[f.id] <= f.max));
ok('sensitivity is a multiplier on the base', defs.sensitivity === 1 && config.BASE_SENSITIVITY > 0);
ok('a corrupt stored value is clamped, not honoured', (() => {
  localStorage.setItem('nightshift.settings.v1', JSON.stringify({ sensitivity: 9999, fov: -40, volume: 12 }));
  const s = config.load();
  const inRange = config.SCHEMA.every((f) => s[f.id] >= f.min && s[f.id] <= f.max);
  localStorage.removeItem('nightshift.settings.v1');
  return inRange;
})(), 'a stored sensitivity of 9999 would make the game unplayable');
ok('settings round-trip through storage', (() => {
  const s = config.defaults(); s.fov = 95; s.invertY = true;
  config.save(s);
  const back = config.load();
  localStorage.removeItem('nightshift.settings.v1');
  return back.fov === 95 && back.invertY === true;
})());
ok('a wrong-typed stored value falls back to the default', (() => {
  localStorage.setItem('nightshift.settings.v1', JSON.stringify({ shadows: 'yes please' }));
  const s = config.load();
  localStorage.removeItem('nightshift.settings.v1');
  return s.shadows === true;
})());

// ===========================================================================
head('aim down sights');

loadLevel(0); player.reset();
const hipFov = weapon.fovScale, hipMove = weapon.moveScale;
ok('hip fire is the neutral state', hipFov === 1 && hipMove === 1 && weapon.aimT === 0);

const aimCtx = () => ({ wantFire: false, wantAim: true, camera, targets: [], horde, speed: 0 });
for (let i = 0; i < 60; i++) weapon.step(STEP, aimCtx());
ok('sights come up within a second', weapon.aimT > 0.98, `aimT=${weapon.aimT.toFixed(3)}`);
ok('aiming narrows the field of view', weapon.fovScale < 1, `fov ×${weapon.fovScale.toFixed(2)}`);
ok('aiming costs movement speed', weapon.moveScale < 0.7, `move ×${weapon.moveScale.toFixed(2)}`);
ok('look speed scales with the zoom', weapon.lookScale === weapon.fovScale);
ok('recoil is softer when sighted', (() => {
  weapon.punch = 1;
  const sighted = weapon.viewPunch;
  const saveT = weapon.aimT; weapon.aimT = 0;
  const hip = weapon.viewPunch;
  weapon.aimT = saveT; weapon.punch = 0;
  return sighted < hip;
})());

for (let i = 0; i < 60; i++) weapon.step(STEP, { ...aimCtx(), wantAim: false });
ok('releasing returns to the hip', weapon.aimT === 0 && weapon.fovScale === 1);

// You cannot sight a weapon you are loading.
weapon.mag = 0; weapon.reserve = 40; weapon.startReload();
for (let i = 0; i < 20; i++) weapon.step(STEP, aimCtx());
ok('reloading blocks aiming', weapon.aimT === 0 && weapon.wantAim === false);
weapon.reloading = 0; weapon.mag = weapon.magSize;

// Sprint and aim contradict each other.
player.reset(); player.aimScale = 1;
keys.add('KeyW'); keys.add('ShiftLeft');
let m0 = player.pos.clone(); sim(60);
const freeSprint = player.pos.distanceTo(m0);
player.reset(); player.aimScale = 0.55;
m0 = player.pos.clone();
for (let i = 0; i < 60; i++) {
  player.aimScale = 0.55;    // main rewrites this every step from the weapon
  world.update(STEP); player.step(STEP, input, world.colliders);
}
const aimedSprint = player.pos.distanceTo(m0);
keys.clear();
ok('you cannot sprint while sighted', aimedSprint < freeSprint * 0.7 && !player.sprinting,
  `${aimedSprint.toFixed(2)} vs ${freeSprint.toFixed(2)} m/s`);
player.aimScale = 1; player.reset();

// ===========================================================================
head('damage direction');

const near = (a, b, tol = 0.02) => Math.abs(a - b) < tol;
ok('a zombie dead ahead reads as ahead', near(bearing(0, 0, 0, 0, -5), 0),
  `${bearing(0, 0, 0, 0, -5).toFixed(3)} rad`);
ok('a zombie behind reads as behind', near(Math.abs(bearing(0, 0, 0, 0, 5)), Math.PI),
  `${bearing(0, 0, 0, 0, 5).toFixed(3)} rad`);
ok('a zombie to the right reads as the right', near(bearing(0, 0, 0, 5, 0), Math.PI / 2),
  `${bearing(0, 0, 0, 5, 0).toFixed(3)} rad`);
ok('a zombie to the left reads as the left', near(bearing(0, 0, 0, -5, 0), -Math.PI / 2),
  `${bearing(0, 0, 0, -5, 0).toFixed(3)} rad`);
ok('bearing follows the player turning', (() => {
  // Face east; a zombie due east is now dead ahead rather than to the right.
  return near(bearing(0, 0, -Math.PI / 2, 5, 0), 0);
})());
ok('bearing is independent of distance',
  near(bearing(0, 0, 0, 3, -3), bearing(0, 0, 0, 30, -30)));

// ===========================================================================
head('growls');

let growls = 0;
const listener = new Horde({
  onPlayerHit: () => {}, onKill: () => {}, onGrowl: () => growls++,
});
listener.attachTo(world.scene);
listener.spawnAt(new THREE.Vector3(0, 0, 6), 500, 0.001, world.colliders, null, 'shambler', 1);
for (let i = 0; i < 60 * 20; i++) listener.step(STEP, player.pos, world.colliders);
ok('a nearby zombie growls', growls > 0, `${growls} in 20s`);

growls = 0;
listener.clear();
// Far away: outside the 30m audible radius, it should stay quiet.
listener.spawnAt(new THREE.Vector3(0, 0, -19), 500, 0.0001, world.colliders, null, 'shambler', 1);
const far = listener.pool.find((z) => z.active);
far.pos.set(0, 0, -19);
player.pos.set(0, 0, 19);
let farGrowls = 0;
for (let i = 0; i < 60 * 10; i++) {
  far.pos.set(0, 0, -19);          // pin it; we are testing the distance gate
  listener.step(STEP, player.pos, world.colliders);
}
farGrowls = growls;
ok('a zombie 38m away stays quiet', farGrowls === 0, `${farGrowls} growls`);
listener.clear();
player.reset();

// ===========================================================================
head('rendering');

// Logic tests can all pass while the screen stays black. This renders real
// frames to an offscreen context and reads the pixels back.
{
  const W = 320, H = 180;
  const rc = document.createElement('canvas');
  rc.width = W; rc.height = H;
  const r = new THREE.WebGLRenderer({ canvas: rc, antialias: false, preserveDrawingBuffer: true });
  r.setSize(W, H, false);
  r.setClearColor(0x0a0c10, 1);
  r.shadowMap.type = THREE.PCFSoftShadowMap;

  loadLevel(0);
  horde.clear();

  // Shadows only exist under a light that casts, so aim the camera at one
  // instead of at an arbitrary patch of floor. Standing at the spawn and
  // hoping is how you "prove" shadows work while looking at nothing.
  let caster = null;
  world.scene.traverse((o) => { if (o.isLight && o.castShadow && !caster) caster = o; });
  ok('the level has a shadow-casting light', !!caster,
    caster ? `${caster.type} at (${caster.position.x}, ${caster.position.z})` : 'none found');

  const lx = caster ? caster.position.x : 0;
  const lz = caster ? caster.position.z : 0;

  for (const dx of [-2.5, 0, 2.5]) {
    horde.spawnAt(new THREE.Vector3(lx + dx, 0, lz), 100, 0.001, world.colliders, null, 'shambler', 1);
  }
  horde.render(0);
  horde.syncForRaycast();

  // Two cameras with different jobs. This one is the player's-eye view at the
  // spawn: it judges whether the level is bright enough to play in.
  const cam = new THREE.PerspectiveCamera(78, W / H, 0.05, 220);
  cam.position.set(LEVELS[0].spawn[0], 1.68, LEVELS[0].spawn[1]);
  cam.rotation.set(0, 0, 0);
  cam.updateMatrixWorld();

  // And this one looks straight down at the lamp's pool. A zombie under an
  // overhead light casts its shadow almost directly beneath itself, where an
  // eye-level camera cannot see it — from above it's unmissable.
  const top = new THREE.PerspectiveCamera(70, W / H, 0.05, 220);
  top.position.set(lx, 6.2, lz);
  top.rotation.set(-Math.PI / 2, 0, 0);
  top.updateMatrixWorld();

  const gl = r.getContext();
  const px = new Uint8Array(W * H * 4);
  const shoot = (c = cam) => {
    r.render(world.scene, c);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return px.slice();
  };
  const stats = (buf) => {
    let sum = 0, lit = 0, max = 0;
    for (let i = 0; i < buf.length; i += 4) {
      const l = (buf[i] + buf[i + 1] + buf[i + 2]) / 3;
      sum += l; if (l > 8) lit++; if (l > max) max = l;
    }
    return { mean: sum / (buf.length / 4), lit: lit / (buf.length / 4), max };
  };
  const setShadows = (on) => {
    r.shadowMap.enabled = on;
    world.scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  };

  setShadows(true);
  const withShadow = shoot();
  const s = stats(withShadow);

  ok('the scene renders something', s.max > 12, `max luma ${s.max}`);
  ok('the scene is not a black frame', s.mean > 2, `mean luma ${s.mean.toFixed(1)}`);
  ok('the scene is not blown out', s.mean < 170, `mean luma ${s.mean.toFixed(1)}`);
  ok('most of the frame is geometry, not void', s.lit > 0.4, `${(s.lit * 100).toFixed(0)}% lit`);
  note(`${r.info.render.calls} draw calls, ${r.info.render.triangles} triangles with 3 zombies`);

  // If shadows were doing nothing, the two frames would be identical.
  const withShadowTop = shoot(top);
  setShadows(false);
  const noShadow = shoot(top);
  const withShadow2 = withShadowTop;
  let diff = 0, darkened = 0;
  for (let i = 0; i < px.length; i += 4) {
    const d = noShadow[i] - withShadow2[i];
    diff += Math.abs(d);
    if (d > 6) darkened++;             // shadowing can only remove light
  }
  const perPixel = diff / (W * H);
  ok('shadows actually change the image', perPixel > 0.4,
    `mean red-channel delta ${perPixel.toFixed(2)} per pixel`);
  ok('shadows darken rather than brighten', darkened / (W * H) > 0.01,
    `${((darkened / (W * H)) * 100).toFixed(1)}% of pixels lost light`);

  // The view-model pass must draw over a cleared depth buffer.
  r.autoClear = false;
  setShadows(true);
  r.clear();
  r.render(world.scene, cam);
  r.clearDepth();
  r.render(weapon.scene, weapon.camera);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const withGun = stats(px);
  ok('the weapon pass renders on top', withGun.mean > s.mean * 0.9,
    `mean ${withGun.mean.toFixed(1)} vs ${s.mean.toFixed(1)} world-only`);

  // Every level must render without throwing or going black.
  const dark = [];
  for (let i = 0; i < LEVELS.length; i++) {
    loadLevel(i);
    horde.clear();
    cam.position.set(LEVELS[i].spawn[0], 1.68, LEVELS[i].spawn[1]);
    cam.updateMatrixWorld();
    r.autoClear = true;
    const st = stats(shoot());
    if (st.mean < 2 || st.lit < 0.25) dark.push(`${LEVELS[i].name} (${st.mean.toFixed(1)})`);
  }
  ok('every level renders a lit frame', dark.length === 0, dark.join(', '));

  r.dispose();
}

// ===========================================================================
head('hygiene');

loadLevel(0);
const bad = [player.pos.x, player.pos.y, player.pos.z, player.vel.x, player.yaw, player.pitch]
  .some((v) => !Number.isFinite(v))
  || horde.pool.some((z) => z.active && ![z.pos.x, z.pos.z, z.yaw].every(Number.isFinite));
ok('no NaN in player or horde state', !bad);

// Six level loads must not leak: dispose() has to actually free what it made.
const info = { geometries: 0, textures: 0 };
for (let i = 0; i < LEVELS.length; i++) loadLevel(i);
ok('cycling every level does not throw', true);

document.getElementById('out').textContent =
  log.join('\n') + `\n\n${fails === 0 ? '✓ ALL PASS' : '✗ ' + fails + ' FAILURES'}`
  + `  (${log.filter((l) => l.startsWith('PASS') || l.startsWith('FAIL')).length} checks)`;
window.__fails = fails;
void info;
</script></body></html>
