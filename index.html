<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neal Pathak</title>
<meta name="description" content="Small games and interactive tools.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  .index { list-style: none; margin: 0; padding: 0; }
  .index li + li { border-top: 1px solid var(--line); }
  .index a {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.25rem 1rem;
    padding: 0.9rem 0;
    text-decoration: none;
    color: var(--fg);
  }
  .index a:hover .title { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 0.2em; }
  .title { font-weight: 500; }
  .kind {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--fg-muted);
    align-self: center;
    letter-spacing: 0.04em;
  }
  .index .desc { grid-column: 1 / -1; color: var(--fg-muted); font-size: 0.9375rem; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<main id="main" class="page stack stack-lg">

  <header class="stack">
    <h1>Neal Pathak</h1>
    <p class="muted">Small games and interactive tools.</p>
  </header>

  <!-- Add a project by copying one <li>. Nothing else needs to change.
       <li>
         <a href="/games/slug/">
           <span class="title">Name</span>
           <span class="kind">GAME</span>
           <span class="desc">One line on what it is.</span>
         </a>
       </li>
  -->
  <ul class="index">
    <li>
      <a href="/games/zombies/">
        <span class="title">Nightshift</span>
        <span class="kind">GAME</span>
        <span class="desc">Round-based first-person zombie survival. Needs a mouse and keyboard.</span>
      </a>
    </li>
  </ul>

</main>
</body>
</html>
